name: Set Pages publishing source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-source.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at main / (root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f 'source[branch]=main' -f 'source[path]=/' \
            --jq '{status,html_url,source}'
